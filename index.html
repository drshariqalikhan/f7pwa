<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>API Tester</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#121212">

<link rel="stylesheet"
href="https://unpkg.com/framework7/framework7-bundle.min.css">

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="page">

    <div class="navbar">
        <div class="navbar-inner">
            <div class="title">
                API Tester
            </div>
        </div>
    </div>

    <div class="page-content">

        <!-- REQUEST BAR -->

        <div class="block">

            <div class="request-bar">

                <select id="method">

                    <option>GET</option>
                    <option>POST</option>
                    <option>PUT</option>
                    <option>PATCH</option>
                    <option>DELETE</option>

                </select>

                <input
                    type="text"
                    id="url"
                    placeholder="https://api.example.com">

                <button
                    id="sendBtn"
                    class="button button-fill">
                    Send
                </button>

            </div>

        </div>

        <!-- AUTH -->

        <div class="block">

            <div class="section-title">
                Authentication
            </div>

            <select id="authType">

                <option value="none">
                    No Authentication
                </option>

                <option value="bearer">
                    Bearer Token
                </option>

                <option value="basic">
                    Basic Auth
                </option>

                <option value="apikey">
                    API Key Header
                </option>

            </select>

            <div id="tokenGroup">

                <br>

                <input
                    type="text"
                    id="authValue"
                    placeholder="Token / API Key">

            </div>

            <div id="basicGroup">

                <br>

                <input
                    type="text"
                    id="username"
                    placeholder="Username">

                <br><br>

                <input
                    type="password"
                    id="password"
                    placeholder="Password">

            </div>

        </div>

        <!-- HEADERS -->

        <div class="block">

            <div class="section-title">
                Headers
            </div>

            <div id="headerContainer">

                <div class="header-row">

                    <div class="header-grid">

                        <select class="header-name">

                            <option value="Content-Type">
                                Content-Type
                            </option>

                            <option value="Accept">
                                Accept
                            </option>

                            <option value="Authorization">
                                Authorization
                            </option>

                            <option value="X-API-Key">
                                X-API-Key
                            </option>

                            <option value="Cache-Control">
                                Cache-Control
                            </option>

                        </select>

                        <input
                            type="text"
                            class="header-value"
                            value="application/json">

                        <button
                            class="remove-header button button-fill color-red">
                            ✕
                        </button>

                    </div>

                </div>

            </div>

            <br>

            <button
                id="addHeaderBtn"
                class="button button-outline">

                Add Header

            </button>

        </div>

        <!-- BODY -->

        <div class="block">

            <div class="section-title">
                Request Body
            </div>

            <textarea id="body">
{
    "hello":"world"
}
            </textarea>

        </div>

        <!-- STATUS -->

        <div class="block">

            <div id="meta"></div>

        </div>

        <!-- RESPONSE -->

        <div class="block">

            <div class="section-title">
                Response
            </div>

            <div
                class="response"
                id="response">

Waiting...

            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/framework7/framework7-bundle.min.js"></script>

<script src="js/app.js"></script>

</body>
</html>
