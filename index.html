<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My PWA</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#2196f3">

  <link rel="stylesheet"
        href="https://unpkg.com/framework7/framework7-bundle.min.css">

  <style>
    h1{
      text-align:center;
      margin-top:40px;
    }
  </style>
</head>
<body>

<div id="app">

  <div class="view view-main">

    <div class="page">

      <div class="navbar">
        <div class="navbar-inner">
          <div class="title">My Travel App</div>
        </div>
      </div>

      <div class="page-content">

        <h1>Hello Framework7</h1>

        <div class="block">

          <a href="#"
             class="button button-fill"
             id="testBtn">
             Click Me
          </a>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/framework7/framework7-bundle.min.js"></script>

<script>
const app = new Framework7({
  name: 'MyPWA',
  theme: 'auto'
});

document
  .getElementById('testBtn')
  .addEventListener('click', () => {
    app.dialog.alert('Framework7 is working!');
  });
</script>

</body>
</html>
