<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>API Tester</title>

<link rel="stylesheet"
href="https://unpkg.com/framework7/framework7-bundle.min.css">

<style>
.response {
    background:#111;
    color:#00ff88;
    padding:12px;
    border-radius:8px;
    min-height:300px;
    overflow:auto;
    white-space:pre-wrap;
    font-family:monospace;
}

textarea {
    min-height:150px;
}
</style>

</head>

<body>

<div class="page">

<div class="navbar">
    <div class="navbar-inner">
        <div class="title">API Tester</div>
    </div>
</div>

<div class="page-content">

<div class="block">

<div class="row">

<div class="col-30">
<select id="method">
<option>GET</option>
<option>POST</option>
<option>PUT</option>
<option>PATCH</option>
<option>DELETE</option>
</select>
</div>

<div class="col-70">
<input
type="text"
id="url"
placeholder="https://jsonplaceholder.typicode.com/posts/1">
</div>

</div>

</div>

<div class="block">

<h4>Headers (JSON)</h4>

<textarea id="headers">
{
  "Content-Type":"application/json"
}
</textarea>

</div>

<div class="block">

<h4>Request Body</h4>

<textarea id="body">
{
}
</textarea>

</div>

<div class="block">

<a class="button button-fill button-large" id="sendBtn">
Send Request
</a>

</div>

<div class="block">

<div id="meta"></div>

</div>

<div class="block">

<h3>Response</h3>

<div class="response" id="response">
Waiting...
</div>

</div>

</div>

</div>

<script src="https://unpkg.com/framework7/framework7-bundle.min.js"></script>

<script>

const app = new Framework7();

document.getElementById("sendBtn")
.addEventListener("click", sendRequest);

async function sendRequest(){

    const method =
      document.getElementById("method").value;

    const url =
      document.getElementById("url").value.trim();

    const responseBox =
      document.getElementById("response");

    const meta =
      document.getElementById("meta");

    if(!url){
        app.dialog.alert("Enter URL");
        return;
    }

    let headers = {};

    try{
        headers =
        JSON.parse(
            document.getElementById("headers").value
        );
    }catch(e){
        app.dialog.alert("Headers JSON invalid");
        return;
    }

    let bodyText =
      document.getElementById("body").value;

    const options = {
        method,
        headers
    };

    if(method !== "GET" &&
       method !== "DELETE"){

        options.body = bodyText;
    }

    responseBox.textContent = "Loading...";

    const start = performance.now();

    try{

        const response =
            await fetch(url, options);

        const elapsed =
            Math.round(
                performance.now() - start
            );

        const text =
            await response.text();

        let formatted;

        try{
            formatted =
              JSON.stringify(
                  JSON.parse(text),
                  null,
                  2
              );
        }
        catch{
            formatted = text;
        }

        meta.innerHTML =
        `
        <b>Status:</b> ${response.status}
        <br>
        <b>Time:</b> ${elapsed} ms
        `;

        responseBox.textContent =
          formatted;

    }
    catch(err){

        responseBox.textContent =
        "ERROR\n\n" + err.message;

    }

}

</script>

</body>
</html>
