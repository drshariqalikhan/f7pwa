<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>API Tester</title>

    <link rel="manifest" href="manifest.json">

    <meta
        name="theme-color"
        content="#121212">

    <link
        rel="stylesheet"
        href="https://unpkg.com/framework7/framework7-bundle.min.css">

    <link
        rel="stylesheet"
        href="css/app.css">

</head>

<body>

<div class="page">

    <div class="navbar">

        <div class="navbar-inner">

            <div class="title">
                API Tester
            </div>

        </div>

    </div>

    <div class="page-content">

        <!-- METHOD + URL -->

        <div class="block">

            <div class="row">

                <div class="col-30">

                    <select id="method">

                        <option>GET</option>
                        <option>POST</option>
                        <option>PUT</option>
                        <option>PATCH</option>
                        <option>DELETE</option>

                    </select>

                </div>

                <div class="col-70">

                    <input
                        type="text"
                        id="url"
                        placeholder="https://api.example.com">

                </div>

            </div>

        </div>

        <!-- AUTH -->

        <div class="block">

            <div class="section-title">
                Authentication
            </div>

            <select id="authType">

                <option value="none">
                    No Authentication
                </option>

                <option value="bearer">
                    Bearer Token
                </option>

                <option value="basic">
                    Basic Auth
                </option>

                <option value="apikey">
                    API Key Header
                </option>

            </select>

            <br><br>

            <input
                type="text"
                id="authValue"
                placeholder="Token / API Key">

            <br><br>

            <input
                type="text"
                id="username"
                placeholder="Username">

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password">

        </div>

        <!-- HEADERS -->

        <div class="block">

            <div class="section-title">
                Headers
            </div>

            <div id="headerContainer">

                <div class="header-row">

                    <select class="header-name">

                        <option value="Content-Type">
                            Content-Type
                        </option>

                        <option value="Accept">
                            Accept
                        </option>

                        <option value="Authorization">
                            Authorization
                        </option>

                        <option value="X-API-Key">
                            X-API-Key
                        </option>

                        <option value="User-Agent">
                            User-Agent
                        </option>

                        <option value="Cache-Control">
                            Cache-Control
                        </option>

                    </select>

                    <input
                        type="text"
                        class="header-value"
                        value="application/json">

                    <button
                        class="remove-header button button-small button-outline">
                        X
                    </button>

                </div>

            </div>

            <br>

            <a
                class="button button-outline"
                id="addHeaderBtn">

                Add Header

            </a>

        </div>

        <!-- BODY -->

        <div class="block">

            <div class="section-title">
                Request Body
            </div>

            <textarea id="body">
{
    "hello":"world"
}
            </textarea>

        </div>

        <!-- SEND -->

        <div class="block">

            <a
                class="button button-fill button-large"
                id="sendBtn">

                Send Request

            </a>

        </div>

        <!-- RESPONSE INFO -->

        <div class="block">

            <div id="meta"></div>

        </div>

        <!-- RESPONSE -->

        <div class="block">

            <div class="section-title">
                Response
            </div>

            <div
                class="response"
                id="response">

Waiting...

            </div>

        </div>

    </div>

</div>

<script
src="https://unpkg.com/framework7/framework7-bundle.min.js">
</script>

<script
src="js/app.js">
</script>

</body>
</html>
