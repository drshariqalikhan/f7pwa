<!DOCTYPE html>
<html class="ios dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>API Tester</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <div id="app">
    <div class="views">
      <div class="view view-main">
        <div class="page">

          <!-- iOS Translucent Large Navbar -->
          <div class="navbar navbar-large">
            <div class="navbar-bg"></div>
            <div class="navbar-inner">
              <div class="title">API Tester</div>
              <div class="title-large">
                <div class="title-large-text">API Tester</div>
              </div>
            </div>
          </div>

          <div class="page-content">

            <!-- REQUEST BAR CARD -->
            <div class="block-title">Endpoint</div>
            <div class="list list-strong-ios inset-ios">
              <ul>
                <li>
                  <div class="request-pill">
                    <div class="method-badge-wrap" data-method="GET">
                      <select id="method">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="PATCH">PATCH</option>
                        <option value="DELETE">DELETE</option>
                      </select>
                    </div>
                    <input type="url" id="url" placeholder="https://example.com" autocapitalize="off" autocorrect="off">
                    <button id="sendBtn" class="button button-fill button-round">Send</button>
                  </div>
                </li>
              </ul>
            </div>

            <!-- AUTHENTICATION GROUPED LIST -->
            <div class="block-title">Authentication</div>
            <div class="list list-strong-ios list-dividers-ios inset-ios">
              <ul>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <div class="item-title item-label">Auth Type</div>
                    <div class="item-input-wrap input-dropdown-wrap">
                      <select id="authType">
                        <option value="none">No Authentication</option>
                        <option value="bearer">Bearer Token</option>
                        <option value="basic">Basic Auth</option>
                        <option value="apikey">API Key Header</option>
                      </select>
                    </div>
                  </div>
                </li>

                <!-- Token / API Key Input -->
                <li id="tokenGroup" class="item-content item-input display-none">
                  <div class="item-inner">
                    <div class="item-title item-label">Credentials</div>
                    <div class="item-input-wrap">
                      <input type="text" id="authValue" placeholder="Paste Token or API Key">
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>

                <!-- Basic Auth Inputs -->
                <div id="basicGroup" class="display-none">
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">Username</div>
                      <div class="item-input-wrap">
                        <input type="text" id="username" placeholder="Username" autocapitalize="off">
                        <span class="input-clear-button"></span>
                      </div>
                    </div>
                  </li>
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">Password</div>
                      <div class="item-input-wrap">
                        <input type="password" id="password" placeholder="Password">
                        <span class="input-clear-button"></span>
                      </div>
                    </div>
                  </li>
                </div>
              </ul>
            </div>

            <!-- HEADERS GROUPED LIST -->
            <div class="block-title">Headers</div>
            <div class="list list-strong-ios list-dividers-ios inset-ios">
              <ul id="headerContainer">
                <li class="header-row item-content">
                  <div class="item-inner">
                    <div class="header-name-wrap">
                      <select class="header-name">
                        <option value="Content-Type">Content-Type</option>
                        <option value="Accept">Accept</option>
                        <option value="Authorization">Authorization</option>
                        <option value="X-API-Key">X-API-Key</option>
                        <option value="Cache-Control">Cache-Control</option>
                      </select>
                    </div>
                    <input type="text" class="header-value" value="application/json" placeholder="Header value">
                    <button type="button" class="remove-header button button-tonal color-red">✕</button>
                  </div>
                </li>
              </ul>
              <ul>
                <li>
                  <a href="#" id="addHeaderBtn" class="list-button">+ Add Header</a>
                </li>
              </ul>
            </div>

            <!-- REQUEST BODY -->
            <div class="block-title">Request Body</div>
            <div class="block block-strong-ios inset-ios">
              <textarea id="body" placeholder='{ "key": "value" }'>{
    "hello": "world"
}</textarea>
            </div>

            <!-- STATUS & RESPONSE -->
            <div class="block-title">Response</div>
            <div id="meta"></div>
            <div class="block block-strong-ios inset-ios">
              <div class="response" id="response">Waiting...</div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com"></script>
  <script src="js/app.js"></script>
</body>
</html>
