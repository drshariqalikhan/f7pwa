<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">

    <title>Hello PWA</title>

    <!-- Bulma -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #f5f5f5;
            --accent: #00d1b2;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
        }

        .hero.is-fullheight {
            background: var(--bg);
        }

        .box {
            background: var(--card);
            color: var(--text);
            border: 1px solid #333;
        }

        .title,
        .subtitle,
        .content {
            color: var(--text) !important;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

<section class="hero is-fullheight">
    <div class="hero-body">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-5-desktop is-8-tablet">

                    <div class="box has-text-centered">

                        <h1 class="title is-2">
                            👋 Hello PWA
                        </h1>

                        <p class="subtitle">
                            Vanilla JavaScript + Bulma + Dark Mode
                        </p>

                        <div class="content">
                            <p>
                                <span class="status-dot"></span>
                                App Loaded Successfully
                            </p>
                        </div>

                        <button id="helloBtn" class="button is-primary is-medium">
                            Click Me
                        </button>

                        <p id="message" class="mt-4"></p>

                    </div>

                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.getElementById("helloBtn").addEventListener("click", () => {
    document.getElementById("message").textContent =
        "🚀 Hello from Vanilla JavaScript!";
});
</script>

</body>
</html>
