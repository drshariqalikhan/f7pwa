<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>API Tester</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet"
        href="https://unpkg.com/framework7/framework7-bundle.min.css">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="page">

  <div class="navbar">
    <div class="navbar-inner">
      <div class="title">API Tester</div>
    </div>
  </div>

  <div class="page-content">

    <div class="block">

      <div class="row">

        <div class="col-30">
          <select id="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
          </select>
        </div>

        <div class="col-70">
          <input
            type="text"
            id="url"
            placeholder="https://api.example.com">
        </div>

      </div>

    </div>

    <div class="block">

      <div class="section-title">
        Authentication
      </div>

      <select id="authType">
        <option value="none">None</option>
        <option value="bearer">Bearer Token</option>
        <option value="basic">Basic Auth</option>
      </select>

      <br><br>

      <input
        type="text"
        id="token"
        placeholder="Bearer Token">

      <br><br>

      <input
        type="text"
        id="username"
        placeholder="Username">

      <br><br>

      <input
        type="password"
        id="password"
        placeholder="Password">

    </div>

    <div class="block">

      <div class="section-title">
        Headers
      </div>

      <textarea id="headers">
{
  "Content-Type":"application/json"
}
      </textarea>

    </div>

    <div class="block">

      <div class="section-title">
        Request Body
      </div>

      <textarea id="body">{}</textarea>

    </div>

    <div class="block">

      <a class="button button-fill button-large"
         id="sendBtn">
          Send Request
      </a>

    </div>

    <div class="block">
      <div id="meta"></div>
    </div>

    <div class="block">

      <div class="section-title">
        Response
      </div>

      <div class="response" id="response">
Waiting...
      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/framework7/framework7-bundle.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
