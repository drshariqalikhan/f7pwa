<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>gemma-4-E2B-it-gpu</title>

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" href="./icons/android/mipmap-mdpi/ic_launcher.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/ios/AppIcon.appiconset/Icon-App-60x60@3x.png">
<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7/framework7-bundle.min.css">
<link rel="stylesheet" href="./styles.css?v=15">
</head>

<body>

<div id="app">
    <!-- LAUNCH SPLASH OVERLAY -->
    <div id="splashScreen" class="splash-overlay" role="status" aria-live="polite">
        <!-- TOP BAR OF SPLASH: MODEL PILL + SPLASH GEAR BUTTON -->
        <div class="splash-top-bar">
            <div class="splash-pill">
                <span class="model-dot"></span>
                <span class="splash-brand" id="splashTitle">gemma-4-E2B-it-gpu</span>
            </div>
            <button type="button" class="splash-gear-btn" id="splashSettingsBtn" title="Model settings" aria-label="Model settings">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>

        <div class="splash-center" id="splashStage" data-scene="1">
            <div class="splash-story" id="splashStory">
                <div class="splash-emoji" id="splashEmoji">☀️</div>
                <div class="splash-headline" id="splashHeadline">Gemma is waking up...</div>
            </div>

            <div class="open-sign-stage" id="openSignStage" hidden>
                <div class="sign-hinge">
                    <div class="sign-cords"><span></span><span></span></div>
                    <div class="sign-board">
                        <div class="sign-side sign-closed">CLOSED</div>
                        <div class="sign-side sign-open">
                            <span class="sign-open-main">OPEN</span>
                            <span class="sign-open-sub">FOR BUSINESS</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="splash-bottom">
            <div class="splash-status" id="splashStatus">Starting up...</div>
            <div class="splash-progress-track">
                <div class="splash-progress-fill indeterminate" id="splashProgressFill"></div>
            </div>
            <div class="splash-error" id="splashError" hidden></div>
            <button type="button" class="splash-retry-btn" id="splashRetryBtn" hidden>Retry</button>
        </div>
    </div>

    <!-- SLICK APPLE GLASS SETTINGS MODAL -->
    <div id="settingsModal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsHeading">
            <div class="modal-header">
                <div class="modal-title-row">
                    <span class="settings-title-icon">⚙️</span>
                    <h2 id="settingsHeading" class="modal-title">Model Settings</h2>
                </div>
                <button type="button" id="closeSettingsBtn" class="modal-close-btn" aria-label="Close settings">✕</button>
            </div>

            <div class="modal-body">
                <!-- MODEL URL -->
                <div class="setting-group">
                    <label for="modelUrlInput" class="setting-label">LiteRT Model URL (.litertlm)</label>
                    <textarea id="modelUrlInput" class="setting-textarea" rows="2" spellcheck="false" placeholder="https://..."></textarea>
                    <div class="setting-hint">Direct raw Hugging Face resolve URL to a .litertlm file.</div>
                    <div class="preset-chips">
                        <button type="button" class="preset-btn" data-preset="gpu">⚡ GPU + Multimodal</button>
                        <button type="button" class="preset-btn" data-preset="web">🪶 Web Text-only</button>
                    </div>
                </div>

                <!-- BACKEND SELECTORS (AUDIO & VISION) -->
                <div class="setting-row-inputs">
                    <div class="setting-group">
                        <label for="visionBackendSelect" class="setting-label">Vision (Images)</label>
                        <select id="visionBackendSelect" class="setting-select">
                            <option value="CPU">CPU (XNNPACK)</option>
                            <option value="GPU">GPU (WebGPU)</option>
                            <option value="OFF">Disabled</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label for="audioBackendSelect" class="setting-label">Audio (Voice)</label>
                        <select id="audioBackendSelect" class="setting-select">
                            <option value="CPU">CPU (XNNPACK)</option>
                            <option value="GPU">GPU (WebGPU)</option>
                            <option value="OFF">Disabled</option>
                        </select>
                    </div>
                </div>

                <!-- SYSTEM PROMPT -->
                <div class="setting-group">
                    <label for="systemPromptInput" class="setting-label">System Prompt</label>
                    <textarea id="systemPromptInput" class="setting-textarea" rows="2" placeholder="You are a helpful and concise assistant."></textarea>
                </div>

                <!-- TOKENS & TEMP -->
                <div class="setting-row-inputs">
                    <div class="setting-group">
                        <label for="maxTokensInput" class="setting-label">Max Output Tokens</label>
                        <input type="number" id="maxTokensInput" class="setting-input" min="128" max="8192" step="64">
                    </div>

                    <div class="setting-group">
                        <label for="tempInput" class="setting-label">Temperature: <span id="tempVal">0.7</span></label>
                        <input type="range" id="tempInput" class="setting-range" min="0.0" max="1.0" step="0.05">
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" id="resetModelBtn" class="modal-btn secondary">Reset Defaults</button>
                <button type="button" id="saveModelBtn" class="modal-btn primary">Save & Apply</button>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div class="view view-main">
        <div class="page">

            <div class="navbar">
                <div class="navbar-inner">
                    <div class="chat-header-info">
                        <span class="model-dot"></span>
                        <div class="header-titles">
                            <div class="model-label" id="assistantName">gemma-4-E2B-it-gpu</div>
                            <div class="header-status" id="statusText">Online</div>
                        </div>
                    </div>

                    <!-- Clean side-by-side actions (NEVER OVERLAPPING) -->
                    <div class="nav-actions">
                        <button class="icon-nav-btn" id="settingsBtn" type="button" title="Model settings" aria-label="Model settings">
                            <svg viewBox="0 0 24 24">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </button>
                        <button class="clear-btn" id="clearBtn" type="button">Clear</button>
                    </div>
                </div>
            </div>

            <div class="chat-scroll" id="chatMessages"></div>

            <div class="composer-wrap">
                <div class="attachment-bar" id="attachmentPreview" hidden></div>

                <form class="glass-composer" id="chatForm">
                    <input type="file" id="imageInput" accept="image/*" hidden>

                    <button
                        type="button"
                        id="imageBtn"
                        class="icon-btn"
                        aria-label="Attach image"
                        title="Attach image">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </button>

                    <textarea
                        id="chatInput"
                        class="chat-input"
                        rows="1"
                        placeholder="Message..."
                        autocomplete="off"></textarea>

                    <button
                        type="button"
                        id="micBtn"
                        class="icon-btn"
                        aria-label="Record voice"
                        title="Record voice">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A5 5 0 0 0 17 11z"/>
                        </svg>
                    </button>

                    <button
                        type="submit"
                        id="sendBtn"
                        class="send-btn"
                        aria-label="Send message"
                        disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/framework7/framework7-bundle.min.js"></script>
<script type="module" src="./app.js?v=15"></script>

</body>
</html>
