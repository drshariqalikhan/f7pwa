<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>gemma-4-E2B-it-gpu</title>

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7/framework7-bundle.min.css">
<link rel="stylesheet" href="./styles.css?v=9">
</head>

<body>

<div id="app">
    <!-- ANIMATED TYPOGRAPHY SPLASH -->
    <div id="splashScreen" class="splash-overlay" role="status" aria-live="polite">
        <div class="splash-top">
            <span class="model-dot"></span>
            <span class="splash-brand" id="splashTitle">gemma-4-E2B-it-gpu</span>
        </div>

        <div class="splash-center" id="splashStage" data-scene="1">
            <!-- Animated morning text -->
            <div class="splash-story" id="splashStory">
                <div class="splash-emoji" id="splashEmoji">☀️</div>
                <div class="splash-headline" id="splashHeadline">Gemma is waking up...</div>
            </div>

            <!-- Finale: Swinging 3D "OPEN FOR BUSINESS" sign -->
            <div class="open-sign-stage" id="openSignStage" hidden>
                <div class="sign-hinge">
                    <div class="sign-cords">
                        <span></span><span></span>
                    </div>
                    <div class="sign-board">
                        <div class="sign-side sign-closed">CLOSED</div>
                        <div class="sign-side sign-open">
                            <span class="sign-open-main">OPEN</span>
                            <span class="sign-open-sub">FOR BUSINESS</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="splash-bottom">
            <div class="splash-status" id="splashStatus">Starting up...</div>
            <div class="splash-progress-track">
                <div class="splash-progress-fill indeterminate" id="splashProgressFill"></div>
            </div>
            <div class="splash-error" id="splashError" hidden></div>
            <button type="button" class="splash-retry-btn" id="splashRetryBtn" hidden>Retry</button>
        </div>
    </div>

    <div class="view view-main">
        <div class="page">

            <div class="navbar">
                <div class="navbar-inner">
                    <div class="chat-header-info">
                        <span class="model-dot"></span>
                        <div class="header-titles">
                            <div class="model-label" id="assistantName">gemma-4-E2B-it-gpu</div>
                            <div class="header-status" id="statusText">Online</div>
                        </div>
                    </div>

                    <button class="clear-btn" id="clearBtn" type="button">Clear</button>
                </div>
            </div>

            <div class="chat-scroll" id="chatMessages"></div>

            <div class="composer-wrap">
                <div class="attachment-bar" id="attachmentPreview" hidden></div>

                <form class="glass-composer" id="chatForm">
                    <input type="file" id="imageInput" accept="image/*" hidden>

                    <button
                        type="button"
                        id="imageBtn"
                        class="icon-btn"
                        aria-label="Attach image"
                        title="Attach image">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </button>

                    <textarea
                        id="chatInput"
                        class="chat-input"
                        rows="1"
                        placeholder="Message..."
                        autocomplete="off"></textarea>

                    <button
                        type="button"
                        id="micBtn"
                        class="icon-btn"
                        aria-label="Record voice"
                        title="Record voice">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A5 5 0 0 0 17 11z"/>
                        </svg>
                    </button>

                    <button
                        type="submit"
                        id="sendBtn"
                        class="send-btn"
                        aria-label="Send message"
                        disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/framework7/framework7-bundle.min.js"></script>
<script type="module" src="./app.js?v=9"></script>

</body>
</html>
